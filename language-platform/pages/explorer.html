<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Explorer - MEMBRA Language Platform</title>
<style>
:root{--bg:#0d0d0d;--card:#1a1a1a;--accent:#ff6b00;--text:#e0e0e0;--dim:#888;--border:#333;--hover:#222}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono','Fira Code',monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
nav{background:#111;border-bottom:1px solid var(--border);padding:0.75rem 2rem;display:flex;align-items:center;gap:1.5rem}
nav a{color:var(--dim);text-decoration:none;font-size:0.8rem;transition:color .2s}
nav a:hover,nav a.active{color:var(--accent)}
nav .logo{color:var(--accent);font-weight:bold;font-size:1rem;margin-right:auto}
.shell{display:flex;flex:1;overflow:hidden}
.sidebar{width:340px;min-width:280px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:#111}
.sidebar-header{padding:1rem;border-bottom:1px solid var(--border)}
.sidebar-header h2{color:var(--accent);font-size:0.85rem;margin-bottom:0.75rem}
.filter-row{display:flex;gap:0.5rem;margin-bottom:0.5rem}
.filter-row select,.filter-row input{flex:1;padding:0.4rem 0.6rem;background:#1a1a1a;border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:0.75rem}
.filter-row select:focus,.filter-row input:focus{outline:none;border-color:var(--accent)}
.tree{flex:1;overflow-y:auto;padding:0.5rem 0}
.tree-group{margin-bottom:0.25rem}
.tree-group-header{display:flex;align-items:center;gap:0.5rem;padding:0.4rem 1rem;cursor:pointer;font-size:0.75rem;color:var(--dim);user-select:none;transition:background .15s}
.tree-group-header:hover{background:var(--hover)}
.tree-group-header .arrow{transition:transform .2s;font-size:0.6rem}
.tree-group-header.open .arrow{transform:rotate(90deg)}
.tree-group-header .count{margin-left:auto;background:#222;padding:1px 6px;border-radius:8px;font-size:0.65rem;color:var(--accent)}
.tree-items{display:none}
.tree-group-header.open+.tree-items{display:block}
.tree-item{display:flex;align-items:center;gap:0.5rem;padding:0.35rem 1rem 0.35rem 2rem;cursor:pointer;font-size:0.75rem;transition:background .15s;border-left:2px solid transparent}
.tree-item:hover{background:var(--hover)}
.tree-item.selected{background:#1f1500;border-left-color:var(--accent)}
.tree-item .icon{width:16px;text-align:center;flex-shrink:0}
.tree-item .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tree-item .ext{color:var(--dim);font-size:0.65rem;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:2rem}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--dim);gap:1rem}
.empty-state .big{font-size:3rem;opacity:0.3}
.detail{max-width:800px}
.detail-header{margin-bottom:2rem}
.detail-header h1{font-size:1.2rem;color:#fff;margin-bottom:0.25rem;word-break:break-all}
.detail-header .meta{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.5rem}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.7rem;font-weight:bold}
.pill-system{background:#1a1200;color:var(--accent);border:1px solid #3a2800}
.pill-ws{background:#0d1a0d;color:#4caf50;border:1px solid #1a3a1a}
.pill-ext{background:#0d0d1a;color:#6b8aff;border:1px solid #1a1a3a}
.pill-stage{background:#1a0d1a;color:#ce93d8;border:1px solid #3a1a3a}
.section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1rem;box-shadow:4px 4px 12px #080808,-3px -3px 8px #222}
.section h3{color:var(--accent);font-size:0.8rem;margin-bottom:0.75rem;text-transform:uppercase;letter-spacing:0.05em}
.field{display:flex;justify-content:space-between;align-items:flex-start;padding:0.4rem 0;border-bottom:1px solid #1a1a1a;gap:1rem}
.field:last-child{border-bottom:none}
.field .label{color:var(--dim);font-size:0.75rem;flex-shrink:0;width:180px}
.field .value{font-size:0.75rem;color:var(--text);word-break:break-all;text-align:right;flex:1}
.field .value.hash{font-size:0.65rem;color:#6b8aff}
.field .value.bool-true{color:#4caf50}
.field .value.bool-false{color:#ef5350}
.copy-btn{background:none;border:1px solid var(--border);color:var(--dim);padding:2px 8px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:0.65rem;transition:all .2s}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.copied{border-color:#4caf50;color:#4caf50}
.status-bar{background:#111;border-top:1px solid var(--border);padding:0.4rem 2rem;font-size:0.7rem;color:var(--dim);display:flex;gap:2rem}
</style>
</head>
<body>
<nav>
  <span class="logo">MEMBRA</span>
  <a href="/">Dashboard</a>
  <a href="/explorer" class="active">Explorer</a>
  <a href="/passport">Passport</a>
  <a href="/docs">API Docs</a>
</nav>
<div class="shell">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>File Explorer</h2>
      <div class="filter-row">
        <select id="f-system"><option value="">All Systems</option></select>
        <select id="f-ws"><option value="">All Workstreams</option></select>
      </div>
      <div class="filter-row">
        <select id="f-ext"><option value="">All Types</option></select>
        <input id="f-search" type="text" placeholder="Filter files...">
      </div>
    </div>
    <div class="tree" id="tree"></div>
  </div>
  <div class="main" id="main">
    <div class="empty-state">
      <div class="big">&#128194;</div>
      <div>Select a file from the tree to view its metadata</div>
      <div style="font-size:0.75rem">315 collateral files across 3 systems</div>
    </div>
  </div>
</div>
<div class="status-bar">
  <span id="sb-total">Loading...</span>
  <span id="sb-filter"></span>
</div>
<script>
const BASE='';
let allItems=[], filtered=[], selectedSku=null;

const extIcons={'.pdf':'\u{1F4C4}','.csv':'\u{1F4CA}','.zip':'\u{1F4E6}','.gz':'\u{1F4E6}','.example':'\u{2699}'};
function icon(ext){return extIcons[ext]||'\u{1F4C3}'}

async function boot(){
  const [collateral,systems,workstreams]=await Promise.all([
    fetch(BASE+'/api/collateral?limit=500').then(r=>r.json()),
    fetch(BASE+'/api/systems').then(r=>r.json()),
    fetch(BASE+'/api/workstreams').then(r=>r.json())
  ]);
  allItems=collateral.items;
  const fSys=document.getElementById('f-system');
  systems.systems.forEach(s=>{const o=document.createElement('option');o.value=s.system;o.textContent=s.system.replace('language-','');fSys.appendChild(o)});
  const fWs=document.getElementById('f-ws');
  workstreams.workstreams.forEach(w=>{const o=document.createElement('option');o.value=w.workstream;o.textContent=w.workstream;fWs.appendChild(o)});
  const exts=[...new Set(allItems.map(i=>i.extension))].sort();
  const fExt=document.getElementById('f-ext');
  exts.forEach(e=>{const o=document.createElement('option');o.value=e;o.textContent=e;fExt.appendChild(o)});
  applyFilters();
  document.getElementById('f-system').addEventListener('change',applyFilters);
  document.getElementById('f-ws').addEventListener('change',applyFilters);
  document.getElementById('f-ext').addEventListener('change',applyFilters);
  let deb;
  document.getElementById('f-search').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(applyFilters,200)});
}

function applyFilters(){
  const sys=document.getElementById('f-system').value;
  const ws=document.getElementById('f-ws').value;
  const ext=document.getElementById('f-ext').value;
  const q=document.getElementById('f-search').value.toLowerCase().trim();
  filtered=allItems.filter(i=>{
    if(sys&&i._system!==sys)return false;
    if(ws&&i.workstream!==ws)return false;
    if(ext&&i.extension!==ext)return false;
    if(q&&!i.filename_hint.toLowerCase().includes(q)&&!(i.sku||'').toLowerCase().includes(q))return false;
    return true;
  });
  renderTree();
  document.getElementById('sb-total').textContent=`${filtered.length} of ${allItems.length} files`;
  document.getElementById('sb-filter').textContent=sys||ws||ext||q?'(filtered)':'';
}

function renderTree(){
  const grouped={};
  filtered.forEach(i=>{
    const ws=i.workstream||'Other';
    if(!grouped[ws])grouped[ws]=[];
    grouped[ws].push(i);
  });
  const tree=document.getElementById('tree');
  tree.innerHTML='';
  Object.keys(grouped).sort().forEach(ws=>{
    const items=grouped[ws];
    const grp=document.createElement('div');
    grp.className='tree-group';
    const hdr=document.createElement('div');
    hdr.className='tree-group-header open';
    hdr.innerHTML=`<span class="arrow">▶</span> ${ws} <span class="count">${items.length}</span>`;
    hdr.addEventListener('click',()=>hdr.classList.toggle('open'));
    grp.appendChild(hdr);
    const list=document.createElement('div');
    list.className='tree-items';
    items.sort((a,b)=>a.filename_hint.localeCompare(b.filename_hint)).forEach(i=>{
      const row=document.createElement('div');
      row.className='tree-item'+(selectedSku===i.sku?' selected':'');
      row.innerHTML=`<span class="icon">${icon(i.extension)}</span><span class="fname" title="${i.filename_hint}">${i.filename_hint}</span><span class="ext">${i._system.replace('language-','')}</span>`;
      row.addEventListener('click',()=>selectItem(i));
      list.appendChild(row);
    });
    grp.appendChild(list);
    tree.appendChild(grp);
  });
}

function selectItem(item){
  selectedSku=item.sku;
  document.querySelectorAll('.tree-item').forEach(el=>el.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  renderDetail(item);
}

function copyText(text,btn){
  navigator.clipboard.writeText(text).then(()=>{btn.textContent='copied';btn.classList.add('copied');setTimeout(()=>{btn.textContent='copy';btn.classList.remove('copied')},1500)});
}

function field(label,value,cls){
  if(value===undefined||value===null)return'';
  let vclass='value'+(cls?' '+cls:'');
  let display=value;
  if(typeof value==='boolean')display=value?'Yes':'No',vclass+=' '+(value?'bool-true':'bool-false');
  return`<div class="field"><span class="label">${label}</span><span class="${vclass}">${display}</span></div>`;
}

function hashField(label,value){
  if(!value)return'';
  const short=value.length>20?value.slice(0,12)+'...'+value.slice(-8):value;
  return`<div class="field"><span class="label">${label}</span><span class="value hash" title="${value}">${short} <button class="copy-btn" onclick="copyText('${value}',this)">copy</button></span></div>`;
}

function renderDetail(r){
  const main=document.getElementById('main');
  const stageLabels={3:'LC3 – Catalogued',5:'LC5 – Scanned',7:'LC7 – Verified',9:'LC9 – Sealed'};
  const stageLabel=stageLabels[r.lifecycle_stage]||`LC${r.lifecycle_stage}`;
  main.innerHTML=`<div class="detail">
    <div class="detail-header">
      <h1>${icon(r.extension)} ${r.filename_hint}</h1>
      <div class="meta">
        <span class="pill pill-system">${r._system}</span>
        <span class="pill pill-ws">${r.workstream}</span>
        <span class="pill pill-ext">${r.extension}</span>
        <span class="pill pill-stage">${stageLabel}</span>
      </div>
    </div>
    <div class="section">
      <h3>Identity</h3>
      ${field('SKU',r.sku)}
      ${field('Row ID',r.row_id)}
      ${field('Object Type',r.object_type)}
      ${field('Category',r.category)}
      ${field('Subcategory',r.subcategory)}
      ${field('Kind',r.kind)}
      ${field('Version',r.version)}
      ${field('Jurisdiction',r.jurisdiction)}
    </div>
    <div class="section">
      <h3>Classification</h3>
      ${field('System',r.system_name)}
      ${field('Workstream',r.workstream)}
      ${field('Sub-workstream',r.sub_workstream)}
      ${field('Extension',r.extension)}
      ${field('File Size',r.file_size_bytes+' bytes')}
      ${field('Lifecycle Stage',stageLabel)}
    </div>
    <div class="section">
      <h3>Provenance Hashes</h3>
      ${hashField('Raw File Hash',r.raw_file_hash)}
      ${hashField('Base64 Hash',r.base64_hash)}
      ${hashField('SKU Hash',r.sku_hash)}
      ${hashField('Manifest Hash',r.manifest_hash)}
      ${hashField('Subject PID Hash',r.subject_pid_hash)}
    </div>
    <div class="section">
      <h3>Privacy</h3>
      ${field('Content Exposed',r.content_exposed)}
      ${field('Identity Exposed',r.identity_exposed)}
      ${field('Subject PID',r.subject_pid)}
    </div>
    <div class="section">
      <h3>Anchoring</h3>
      ${field('Git Commit',r.git_commit_short)}
      ${field('Solana TX',r.solana_tx_short)}
      ${field('Created',r.created_at)}
      ${field('Updated',r.updated_at)}
    </div>
    <div style="margin-top:1rem;text-align:right">
      <button class="copy-btn" style="padding:6px 14px;font-size:0.75rem" onclick="copyText(JSON.stringify(${JSON.stringify(JSON.stringify(r))},null,2),this)">Copy Full JSON</button>
    </div>
  </div>`;
}

boot();
</script>
</body>
</html>

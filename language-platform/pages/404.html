<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 — CollateralOps</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-deep:#020204;--bg-surface:#0a0a0f;--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.06);--text-primary:#f0f0f8;--text-secondary:#8a8a9e;--text-muted:#4a4a5e;--cyan:#00f0ff;--cyan-dim:rgba(0,240,255,0.12);--font-sans:'Space Grotesk',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg-deep);color:var(--text-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
.status{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.2em;margin-bottom:16px}
h1{font-size:clamp(64px,12vw,140px);font-weight:700;color:var(--cyan);text-shadow:0 0 60px rgba(0,240,255,0.25);line-height:1}
p{color:var(--text-secondary);font-size:16px;margin:16px 0 32px;max-width:400px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;transition:all 0.3s;background:var(--glass);border:1px solid var(--glass-border);color:var(--text-primary)}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.glitch{position:relative}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%}
.glitch::before{left:2px;text-shadow:-1px 0 var(--red);clip:rect(24px,550px,90px,0);animation:glitch-anim-2 3s infinite linear alternate-reverse}
.glitch::after{left:-2px;text-shadow:-1px 0 var(--purple);clip:rect(85px,550px,140px,0);animation:glitch-anim 2.5s infinite linear alternate-reverse}
@keyframes glitch-anim{0%{clip:rect(10px,9999px,30px,0)}20%{clip:rect(80px,9999px,100px,0)}40%{clip:rect(30px,9999px,50px,0)}60%{clip:rect(60px,9999px,80px,0)}80%{clip:rect(20px,9999px,40px,0)}100%{clip:rect(50px,9999px,70px,0)}}
@keyframes glitch-anim-2{0%{clip:rect(60px,9999px,80px,0)}20%{clip:rect(20px,9999px,40px,0)}40%{clip:rect(80px,9999px,100px,0)}60%{clip:rect(30px,9999px,50px,0)}80%{clip:rect(50px,9999px,70px,0)}100%{clip:rect(10px,9999px,30px,0)}}
</style>
</head>
<body>
<div class="status">Signal Lost // 404</div>
<h1 class="glitch" data-text="404">404</h1>
<p>This asset does not exist in the collateral registry. The coordinates you requested are outside the mapped portfolio.</p>
<a href="/" class="btn">Return to Base</a>
</body>
</html>

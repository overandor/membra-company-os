[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoswarm"
version = "0.1.0"
description = "Genetic layout governance and scheduled wake/sleep lifecycle for tmux panes, with a SQLite receipt ledger."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
chronoswarm = "chronoswarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[workspace]
members = [
    "poi-core",
    "poi-network",
    "poi-bridge",
    "poi-cli",
    "memgas-protocol",
    "worker-reputation",
    "kv-state-collateral",
    "memory-market",
]
exclude = ["poi-solana"]  # Anchor project, separate build process
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["MEMBRA"]
license = "MIT"

[workspace.dependencies]
# Crypto
sha2 = "0.10"
ed25519-dalek = { version = "2.0", features = ["serde"] }
rand = "0.8"
merkle = "1.0"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
# Async
tokio = { version = "1.40", features = ["full"] }
# Data structures
dashmap = "6.1"
parking_lot = "0.12"
# Misc
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# IPFS
ipfs-api = "0.17"

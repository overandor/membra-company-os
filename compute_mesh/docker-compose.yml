version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mesh
      POSTGRES_PASSWORD: meshpass
      POSTGRES_DB: meshdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    environment:
      MESH_API_KEY: ${MESH_API_KEY:-change-me-to-a-long-secret}
      MESH_REDIS_URL: redis://redis:6379/0
      MESH_POSTGRES_DSN: postgres://mesh:meshpass@postgres:5432/meshdb
      MESH_TLS_CERT: /app/certs/cert.pem
      MESH_TLS_KEY: /app/certs/key.pem
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - redis
      - postgres

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      MESH_API_KEY: ${MESH_API_KEY:-change-me-to-a-long-secret}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    depends_on:
      - coordinator
    # Scale with: docker compose up -d --scale worker=5

volumes:
  redis_data:
  pg_data:
